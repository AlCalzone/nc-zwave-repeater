name: "Build firmware"

# Run this job on all pushes to master, for pull requests
# as well as published releases
on:
  push:
    branches:
      # This avoids having duplicate builds in non-forked PRs
      - "master"
      - "sisdk-*"
  release:
    types:
      - published
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: "build-firmware-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      package: ${{ steps.version.outputs.package }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # SLC CLI ships no JRE of its own and falls back to `java` on the PATH.
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SLT CLI
        run: |
          curl -o slt.zip https://www.silabs.com/documents/public/software/slt-cli-1.1.0-linux-x64.zip
          unzip -q slt.zip -d /usr/local/bin
          chmod +x /usr/local/bin/slt

      - name: Install SDK and tools
        run: |
          slt --non-interactive install simplicity-sdk/2024.12.1
          slt --non-interactive install slc-cli
          slt --non-interactive install commander
          slt --non-interactive install gcc-arm-none-eabi/12.2.rel1

      - name: Set up tool paths
        run: |
          echo "SDK=$(slt where simplicity-sdk/2024.12.1)" >> $GITHUB_ENV
          echo "TOOLCHAIN=$(slt where gcc-arm-none-eabi/12.2.rel1)" >> $GITHUB_ENV
          echo "SLC_CLI=$(slt where slc-cli)" >> $GITHUB_ENV
          echo "$(slt where slc-cli)" >> $GITHUB_PATH
          echo "$(slt where commander)" >> $GITHUB_PATH

      - name: Build project
        run: tools/build.sh

      - name: Check build output
        run: |
          ls -la build/release

      - name: Determine firmware version
        id: version
        run: |
          VERSION=$(node tools/extract_version.mjs)
          if [ "${{ github.event_name }}" == "release" ]; then
            SUFFIX="$VERSION"
          else
            COMMIT=$(git rev-parse --short ${{ github.sha }})
            SUFFIX="${VERSION}_${COMMIT}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SUFFIX=${SUFFIX}" >> $GITHUB_ENV
          echo "package=zwa2_repeater_${SUFFIX}" >> $GITHUB_OUTPUT

      - name: Copy build artifacts
        run: |
          cp build/release/nc_controller_soc_repeater.hex artifact/zwa2_repeater.hex
          cp build/release/nc_controller_soc_repeater.out artifact/zwa2_repeater.out
          cp build/release/nc_controller_soc_repeater.map artifact/zwa2_repeater.map

      - name: Compute checksums for HEX files
        run: |
          sha256sum artifact/zwa2_repeater.hex | cut -d" " -f1 > artifact/zwa2_repeater.hex.sha256
          md5sum artifact/zwa2_repeater.hex | cut -d" " -f1 > artifact/zwa2_repeater.hex.md5

      - name: Prepare files for upload
        run: |
          mkdir -p upload
          cp artifact/zwa2_repeater.gbl upload/zwa2_repeater_${{ env.SUFFIX }}.gbl
          echo "GBL=zwa2_repeater_${{ env.SUFFIX }}.gbl" >> $GITHUB_ENV
          cp artifact/zwa2_repeater.hex upload/zwa2_repeater_${{ env.SUFFIX }}.hex
          echo "HEX=zwa2_repeater_${{ env.SUFFIX }}.hex" >> $GITHUB_ENV
          cp artifact/zwa2_repeater.hex.sha256 upload/zwa2_repeater_${{ env.SUFFIX }}.hex.sha256
          echo "HEX_SHA256=zwa2_repeater_${{ env.SUFFIX }}.hex.sha256" >> $GITHUB_ENV
          cp artifact/zwa2_repeater.hex.md5 upload/zwa2_repeater_${{ env.SUFFIX }}.hex.md5
          echo "HEX_MD5=zwa2_repeater_${{ env.SUFFIX }}.hex.md5" >> $GITHUB_ENV
          cp artifact/zwa2_repeater.out upload/zwa2_repeater_${{ env.SUFFIX }}.out
          echo "OUT=zwa2_repeater_${{ env.SUFFIX }}.out" >> $GITHUB_ENV
          cp artifact/zwa2_repeater.map upload/zwa2_repeater_${{ env.SUFFIX }}.map
          echo "MAP=zwa2_repeater_${{ env.SUFFIX }}.map" >> $GITHUB_ENV

      - name: Upload GBL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GBL }}
          path: upload/${{ env.GBL }}

      - name: Upload HEX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HEX }}
          path: upload/${{ env.HEX }}

      - name: Upload HEX SHAsum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HEX_SHA256 }}
          path: upload/${{ env.HEX_SHA256 }}

      - name: Upload HEX MD5sum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HEX_MD5 }}
          path: upload/${{ env.HEX_MD5 }}

      - name: Upload OUT
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: upload/${{ env.OUT }}

      - name: Upload MAP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAP }}
          path: upload/${{ env.MAP }}

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: zwa2_repeater_${{ env.SUFFIX }}
          path: upload/*.*

      - name: Debug Build failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slc_cli_log
          path: ${{ env.SLC_CLI }}/bin/slc-cli/configuration/*.log

  # Separate job so the build job, which runs code from pull requests, keeps a
  # read-only token.
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download firmware package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package }}
          path: upload

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: upload/*.*
